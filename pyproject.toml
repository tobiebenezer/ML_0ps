[project]
name = "breast-cancer-mlops-api"
version = "1.0.0"
description = "MLOps class API: serve, track, test, monitor and continually retrain Breast Cancer model"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "joblib>=1.4",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "mlflow>=2.14",
    "redis>=5.0",
    "apscheduler>=3.10",
    "python-multipart>=0.0.9",
    "pandas>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py311"
